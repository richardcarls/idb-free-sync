name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Fetch release refs
        run: git fetch --force origin main:refs/remotes/origin/main --tags

      - name: Validate release tag
        run: yarn validate:release

      - name: Build, validate, and test
        run: yarn check

      # Yarn packs the tarball so `check` above builds from source, but npm
      # performs the registry publish itself so Trusted Publishing can
      # exchange this job's OIDC token; see scripts/publish-package.mjs.
      - name: Publish and verify package
        run: yarn publish:package
